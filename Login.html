<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الدخول الآمن</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-yellow: #FFD700;
            --secondary-yellow: #FFC107;
            --dark-black: #121212;
            --light-black: #1E1E1E;
            --dark-red: #8B0000;
            --text-color: #FFFFFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background-color: var(--dark-black);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        
        /* شبكة الخلفية المتحركة */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
            overflow: hidden;
        }
        
        .mesh-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: 
                linear-gradient(45deg, var(--dark-red) 0%, transparent 70%),
                linear-gradient(135deg, var(--primary-yellow) 10%, transparent 80%),
                linear-gradient(225deg, var(--light-black) 10%, transparent 80%);
            background-size: 600% 600%;
            animation: meshAnimation 15s ease infinite;
            transform-origin: center;
        }
        
        .mesh-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 0, 0, 0.1) 0%, transparent 40%);
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(2px);
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--primary-yellow);
            top: 10%;
            left: 10%;
            animation: floatShape 25s infinite ease-in-out;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            background: var(--dark-red);
            top: 60%;
            left: 70%;
            animation: floatShape 20s infinite ease-in-out reverse;
            animation-delay: 2s;
        }
        
        .shape-3 {
            width: 150px;
            height: 150px;
            background: var(--secondary-yellow);
            top: 30%;
            left: 80%;
            animation: floatShape 15s infinite ease-in-out;
            animation-delay: 4s;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }
        
        .logo {
            margin-bottom: 30px;
            text-align: center;
            animation: fadeInDown 1s ease;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            color: var(--primary-yellow);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }
        
        .logo p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }
        
        .form-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            animation: zoomIn 0.8s ease;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-yellow), var(--dark-red));
        }
        
        .illustration {
            flex: 1;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.7), rgba(30, 30, 30, 0.7));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .illustration::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 215, 0, 0.1) 10px,
                rgba(255, 215, 0, 0.1) 20px
            );
            animation: moveBackground 20s linear infinite;
        }
        
        .security-badge {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
        }
        
        .security-icon {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
        }
        
        .shield-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--primary-yellow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseGlow 3s infinite;
            box-shadow: 0 0 25px var(--primary-yellow);
        }
        
        .shield-icon {
            font-size: 3.5rem;
            color: var(--dark-black);
        }
        
        .orbiting-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
        }
        
        .orbit-1 {
            width: 140px;
            height: 140px;
            animation: orbitRotate 15s linear infinite;
        }
        
        .orbit-2 {
            width: 160px;
            height: 160px;
            animation: orbitRotate 20s linear infinite reverse;
        }
        
        .orbiting-item {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--primary-yellow);
            border-radius: 50%;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--primary-yellow);
        }
        
        .security-badge h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--primary-yellow);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        
        .security-features {
            list-style: none;
            text-align: right;
            padding: 0;
        }
        
        .security-features li {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            opacity: 0;
            transform: translateX(30px);
            animation: slideInFeature 0.6s forwards;
        }
        
        .security-features li:nth-child(1) { animation-delay: 0.5s; }
        .security-features li:nth-child(2) { animation-delay: 0.7s; }
        .security-features li:nth-child(3) { animation-delay: 0.9s; }
        .security-features li:nth-child(4) { animation-delay: 1.1s; }
        
        .security-features li i {
            color: var(--primary-yellow);
            margin-left: 12px;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .security-features li span {
            flex: 1;
            font-size: 1rem;
        }
        
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: var(--primary-yellow);
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .particle-1 {
            width: 8px;
            height: 8px;
            top: 20%;
            left: 30%;
            animation: floatParticle 12s infinite ease-in-out;
        }
        
        .particle-2 {
            width: 5px;
            height: 5px;
            top: 60%;
            left: 20%;
            animation: floatParticle 15s infinite ease-in-out;
            animation-delay: 1s;
        }
        
        .particle-3 {
            width: 6px;
            height: 6px;
            top: 40%;
            left: 70%;
            animation: floatParticle 10s infinite ease-in-out;
            animation-delay: 2s;
        }
        
        .particle-4 {
            width: 4px;
            height: 4px;
            top: 75%;
            left: 60%;
            animation: floatParticle 18s infinite ease-in-out;
            animation-delay: 3s;
        }
        
        .form-section {
            flex: 1;
            padding: 40px;
            background: rgba(30, 30, 30, 0.6);
        }
        
        .form-toggle {
            display: flex;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 5px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .toggle-btn.active {
            background: var(--primary-yellow);
            color: var(--dark-black);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .form {
            display: none;
        }
        
        .form.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .form-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--primary-yellow);
            text-align: center;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-group i {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--primary-yellow);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .additional-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .forgot-password {
            color: var(--primary-yellow);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .forgot-password:hover {
            color: var(--secondary-yellow);
            text-decoration: underline;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-yellow), var(--secondary-yellow));
            border: none;
            border-radius: 8px;
            color: var(--dark-black);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
        }
        
        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .form-footer a {
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .form-footer a:hover {
            color: var(--secondary-yellow);
            text-decoration: underline;
        }
        
        .password-strength {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-meter {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background 0.3s ease;
            border-radius: 3px;
        }
        
        .strength-meter.weak {
            width: 33.33%;
            background: #ff4d4d;
        }
        
        .strength-meter.medium {
            width: 66.66%;
            background: #ffa64d;
        }
        
        .strength-meter.strong {
            width: 100%;
            background: #00cc66;
        }
        
        .password-info {
            font-size: 0.8rem;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
        }
        
        /* Animations */
        @keyframes meshAnimation {
            0% {
                transform: translate(0, 0) rotate(0deg);
                background-position: 0% 0%;
            }
            50% {
                transform: translate(-5%, -5%) rotate(5deg);
                background-position: 100% 100%;
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
                background-position: 0% 0%;
            }
        }
        
        @keyframes floatShape {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(-30px, -40px) rotate(5deg);
            }
            50% {
                transform: translate(20px, 30px) rotate(-5deg);
            }
            75% {
                transform: translate(-20px, 20px) rotate(3deg);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(-50%, -50%);
            }
        }
        
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px var(--primary-yellow);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px var(--primary-yellow);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 15px var(--primary-yellow);
                transform: scale(1);
            }
        }
        
        @keyframes orbitRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        
        @keyframes slideInFeature {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-20px) translateX(10px);
            }
            50% {
                transform: translateY(10px) translateX(20px);
            }
            75% {
                transform: translateY(20px) translateX(-10px);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .form-container {
                flex-direction: column;
            }
            
            .illustration {
                display: none;
            }
            
            .form-section {
                width: 100%;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mesh-background">
        <div class="mesh-layer"></div>
        <div class="mesh-overlay"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="logo">
            <h1>نظام الدخول الآمن</h1>
            <p>أمان وكفاءة في خدمتكم</p>
        </div>
        
        <div class="form-container">
            <div class="illustration">
                <div class="security-badge">
                    <div class="security-icon">
                        <div class="shield-base">
                            <i class="fas fa-shield-alt shield-icon"></i>
                        </div>
                        <div class="orbiting-elements">
                            <div class="orbit orbit-1">
                                <div class="orbiting-item"></div>
                            </div>
                            <div class="orbit orbit-2">
                                <div class="orbiting-item"></div>
                            </div>
                        </div>
                    </div>
                    <h3>أعلى معايير الأمان</h3>
                    <ul class="security-features">
                        <li><i class="fas fa-lock"></i> <span>تشفير متقدم للبيانات</span></li>
                        <li><i class="fas fa-fingerprint"></i> <span>مصادقة متعددة العوامل</span></li>
                        <li><i class="fas fa-user-shield"></i> <span>حماية من الهجمات الإلكترونية</span></li>
                        <li><i class="fas fa-database"></i> <span>نسخ احتياطية منتظمة</span></li>
                    </ul>
                </div>
                
                <div class="floating-particles">
                    <div class="particle particle-1"></div>
                    <div class="particle particle-2"></div>
                    <div class="particle particle-3"></div>
                    <div class="particle particle-4"></div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-toggle">
                    <button class="toggle-btn active" id="loginToggle">تسجيل الدخول</button>
                    <button class="toggle-btn" id="registerToggle">إنشاء حساب</button>
                </div>
                
                <form class="form active" id="loginForm">
                    <h2 class="form-title">مرحباً بعودتك</h2>
                    
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                    </div>
                    
                    <div class="additional-options">
                        <label class="remember-me">
                            <input type="checkbox"> تذكرني
                        </label>
                        <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                    </div>
                    
                    <button type="submit" class="btn">تسجيل الدخول</button>
                    
                    <div class="divider">
                        <span>أو</span>
                    </div>
                    
                    <div class="social-login">
                        <button class="social-btn"><i class="fab fa-google"></i></button>
                        <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn"><i class="fab fa-twitter"></i></button>
                    </div>
                    
                    <p class="form-footer">
                        ليس لديك حساب؟ <a href="#" id="goToRegister">سجل الآن</a>
                    </p>
                </form>
                
                <form class="form" id="registerForm">
                    <h2 class="form-title">إنشاء حساب جديد</h2>
                    
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="الاسم الكامل" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" placeholder="رقم الهاتف" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="البريد الإلكتروني" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="كلمة المرور" required onkeyup="checkPasswordStrength(this.value)">
                        <div class="password-strength">
                            <div class="strength-meter" id="passwordStrengthMeter"></div>
                        </div>
                        <div class="password-info" id="passwordInfo">أدخل كلمة مرور قوية</div>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="تأكيد كلمة المرور" required>
                    </div>
                    
                    <button type="submit" class="btn">إنشاء حساب</button>
                    
                    <p class="form-footer">
                        لديك حساب بالفعل؟ <a href="#" id="goToLogin">سجل الدخول</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        // تبديل النماذج
        const loginToggle = document.getElementById('loginToggle');
        const registerToggle = document.getElementById('registerToggle');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const goToRegister = document.getElementById('goToRegister');
        const goToLogin = document.getElementById('goToLogin');
        
        loginToggle.addEventListener('click', () => {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            loginToggle.classList.add('active');
            registerToggle.classList.remove('active');
        });
        
        registerToggle.addEventListener('click', () => {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            registerToggle.classList.add('active');
            loginToggle.classList.remove('active');
        });
        
        goToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            registerToggle.click();
        });
        
        goToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            loginToggle.click();
        });
        
        // التحقق من قوة كلمة المرور
        function checkPasswordStrength(password) {
            const strengthMeter = document.getElementById('passwordStrengthMeter');
            const passwordInfo = document.getElementById('passwordInfo');
            
            // إعادة تعيين العداد
            strengthMeter.className = 'strength-meter';
            
            if (password.length === 0) {
                passwordInfo.textContent = 'أدخل كلمة مرور قوية';
                return;
            }
            
            // اختبار قوة كلمة المرور
            let strength = 0;
            
            // إذا كانت تحتوي على أحرف صغيرة وكبيرة
            if (password.match(/([a-z].*[A-Z])|([A-Z].*[a-z])/)) {
                strength += 1;
            }
            
            // إذا كانت تحتوي على أرقام
            if (password.match(/([0-9])/)) {
                strength += 1;
            }
            
            // إذا كانت تحتوي على رموز خاصة
            if (password.match(/([!,@,#,$,%,^,&,*,?,_,~])/)) {
                strength += 1;
            }
            
            // إذا كانت طويلة بما فيه الكفاية
            if (password.length > 7) {
                strength += 1;
            }
            
            // تحديث واجهة المستخدم بناءً على القوة
            switch(strength) {
                case 0:
                case 1:
                    strengthMeter.classList.add('weak');
                    passwordInfo.textContent = 'كلمة المرور ضعيفة';
                    break;
                case 2:
                    strengthMeter.classList.add('medium');
                    passwordInfo.textContent = 'كلمة المرور متوسطة';
                    break;
                case 3:
                case 4:
                    strengthMeter.classList.add('strong');
                    passwordInfo.textContent = 'كلمة المرور قوية';
                    break;
            }
        }
        
        // منع إرسال النماذج (لأغراض العرض فقط)
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('تم إرسال الطلب بنجاح! (هذه رسالة تجريبية)');
            });
        });
    </script>
</body>
</html>
